<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student profile · Faiyaaz MGT 39</title>
<link rel="icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5fb;--card:#fff;--tx:#17161f;--mu:#6b6980;--ac:#6c5ce7;--ac2:#ece9ff;--bd:#e3e1ee;--sh:0 8px 28px -14px rgba(40,30,90,.25)}
[data-theme=dark]{--bg:#0f0e15;--card:#18171f;--tx:#efeef7;--mu:#9d9bb2;--ac:#9a8dff;--ac2:#25223a;--bd:#2a2838;--sh:0 1px 2px #0006}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:560px;margin:0 auto;padding:16px 20px 40px}
.back{display:inline-block;color:var(--ac);text-decoration:none;font-weight:600;padding:8px 0}
.hero{text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:28px 20px 24px;box-shadow:var(--sh);margin-top:8px}
.pic{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid var(--ac);background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:48px;margin:0 auto 14px}
h1{font-size:24px;line-height:1.25;margin:0 0 4px}
.id{color:var(--mu);font-variant-numeric:tabular-nums;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:6px 18px;margin-top:16px;box-shadow:var(--sh)}
.row{padding:13px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row small{display:block;color:var(--mu);font-size:13px;letter-spacing:.02em}
.row span{font-weight:500;white-space:pre-wrap;word-break:break-word}
.na{color:var(--mu);font-weight:400}.tel{color:var(--ac);font-weight:600;text-decoration:none}
.note{text-align:center;color:var(--mu);padding:26px 14px}
.btn{display:inline-block;margin-top:12px;background:var(--ac);color:#fff;text-decoration:none;border-radius:99px;padding:11px 20px;font-weight:600}
</style>
</head>
<body>
<div class="w">
  <a class="back" href="index.html">&larr; Back</a>
  <div class="hero"><div class="pic" id="pic"></div><h1 id="nm">Student</h1><p class="id" id="sid"></p></div>
  <div id="info"></div>
</div>
<script>
try{var t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}catch(e){}
var $=function(i){return document.getElementById(i)};
var q=new URLSearchParams(location.search),id=(q.get("id")||"").trim(),name=(q.get("n")||"").trim();
if(!/^\d{6,}$/.test(id)){$("nm").textContent="Student not found";$("pic").textContent="?";$("info").innerHTML='<p class="note">This profile link is not valid.</p>'}
else{
  $("nm").textContent=name||"Student";$("sid").textContent="ID: "+id;document.title=(name||id)+" \u00b7 Faiyaaz MGT 39";
  var ini=function(){var p=(name||"?").split(/\s+/);return((p[0][0]||"")+(p.length>1?p[p.length-1][0]:"")).toUpperCase()};
  var im=new Image(),ex=[".jpg",".png"],k=0;im.className="pic";im.alt=name;
  function nx(){if(k<ex.length)im.src="students/"+id+ex[k++];else{$("pic").textContent=ini()}}
  im.onload=function(){$("pic").replaceWith(im)};im.onerror=nx;nx();
  var F=[["Hometown",1],["School",2],["College",3],["Birthday",4],["Contact number",5]];
  function show(row){
    var box=document.createElement("div");box.className="card";
    F.forEach(function(f){
      var v=row&&row[f[1]]?row[f[1]].trim():"",na=!v||/^(-|n\/?a)$/i.test(v);
      var d=document.createElement("div");d.className="row";
      var s=document.createElement("small");s.textContent=f[0];d.appendChild(s);
      var p;
      if(!na&&f[0]==="Contact number"&&v.replace(/\D/g,"").length>=6){p=document.createElement("a");p.href="tel:"+v.replace(/[^\d+]/g,"");p.className="tel"}
      else p=document.createElement("span");
      p.textContent=na?"N/A":v;if(na)p.className="na";
      d.appendChild(p);box.appendChild(d)
    });
    $("info").innerHTML="";$("info").appendChild(box)
  }
  fetch("profiles.txt?t="+Date.now()).then(function(r){return r.ok?r.text():""}).catch(function(){return ""}).then(function(tx){
    var row=null;
    String(tx).split(/\r?\n/).forEach(function(l){l=l.trim();if(!l||l[0]==="#")return;var p=l.split("|").map(function(x){return x.trim()});if(p[0].replace(/\D/g,"")===id)row=p});
    show(row)
  })
}
</script>
</body>
</html>
