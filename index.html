footer{padding-left:20px;padding-right:20px;line-height:1.6}footer{text-align:center;color:var(--mu);font-size:13px;padding:30px 0 50px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
