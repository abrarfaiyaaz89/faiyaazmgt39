<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faiyaaz MGT 39 — Management 39 Academic Resources</title>
<meta name="description" content="Notes, slides, books, syllabus and recent-year questions for Management 39 students, organized by semester and course.">
<link rel="canonical" href="https://abrarfaiyaaz89.github.io/faiyaazmgt39/">
<meta property="og:type" content="website">
<meta property="og:title" content="Faiyaaz MGT 39 — Management 39 Academic Resources">
<meta property="og:image" content="https://abrarfaiyaaz89.github.io/faiyaazmgt39/group.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f2e3d'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' font-weight='700' text-anchor='middle' fill='%23d6a24a'%3EM39%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f2e3d;--brass:#b9852c;--bg:#f5f6f4;--card:#fff;--tx:#17252d;--mut:#5d6b73;--ln:#dfe3e0;--hero:#0f2e3d;--r:14px;--sh:0 1px 2px rgba(15,46,61,.06),0 8px 24px -12px rgba(15,46,61,.18)}
[data-theme=dark]{--ink:#e8d3a3;--brass:#d6a24a;--bg:#0c1519;--card:#142229;--tx:#e6ecee;--mut:#93a4ab;--ln:#233640;--hero:#07242f;--sh:0 1px 2px #0006}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;color:var(--ink);line-height:1.2;margin:0}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;gap:12px;height:60px}
.logo{font-family:Fraunces,serif;font-weight:700;font-size:20px;color:var(--ink);margin-right:auto;display:flex;align-items:center;gap:10px}
.logo i{font-style:normal;background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 8px;font-size:14px}
nav{display:flex;gap:4px}nav a{padding:8px 12px;border-radius:8px;font-size:15px;color:var(--mut)}
nav a:hover{background:var(--bg)}nav a.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px var(--brass);border-radius:0}
.ib{background:none;border:1px solid var(--ln);border-radius:10px;width:40px;height:40px;color:var(--tx)}
#menu{display:none}
@media(max-width:820px){#menu{display:block}nav{display:none;position:absolute;top:60px;left:0;right:0;background:var(--card);flex-direction:column;padding:8px 20px 14px;border-bottom:1px solid var(--ln)}nav.open{display:flex}nav a.on{box-shadow:none;color:var(--brass)}}
.hero{background:linear-gradient(rgba(7,36,47,.78),rgba(7,36,47,.9)),url(group.jpg) center/cover var(--hero);color:#fff;padding:72px 0 64px}
.hero h1{color:#fff;font-size:clamp(32px,6vw,54px);max-width:16ch}
.hero p{max-width:52ch;color:#cfdde2;margin:16px 0 26px}
.btn{display:inline-block;padding:12px 20px;border-radius:10px;font-weight:600;border:1px solid transparent;transition:transform .15s}
.btn:active{transform:scale(.97)}.pri{background:var(--brass);color:#fff}.ghost{border-color:#ffffff66;color:#fff}
.sbox{position:relative;margin-top:30px;max-width:560px}
.sbox input{width:100%;padding:15px 18px;border-radius:12px;border:0;font:inherit;background:#fff;color:#17252d}
#res{position:absolute;left:0;right:0;top:56px;background:var(--card);color:var(--tx);border-radius:12px;box-shadow:var(--sh);max-height:320px;overflow:auto;z-index:5}
#res a{display:block;padding:11px 16px;border-bottom:1px solid var(--ln)}#res a:hover{background:var(--bg)}#res small{color:var(--mut);display:block}
section.s{padding:48px 0}.s h2{font-size:28px;margin-bottom:6px}.sub{color:var(--mut);margin:0 0 22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:-34px;position:relative;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--ln)}
.stats div{padding:20px;text-align:center}.stats div+div{border-left:1px solid var(--ln)}
.stats b{display:block;font:700 34px Fraunces,serif;color:var(--ink)}.stats span{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:20px;box-shadow:var(--sh);display:block;transition:transform .2s,border-color .2s}
a.card:hover{transform:translateY(-3px);border-color:var(--brass)}
.card h3{font-size:19px;margin:8px 0 4px}.card p{margin:0;color:var(--mut);font-size:14px}
.code{display:inline-block;font-weight:600;font-size:13px;color:var(--brass);border:1px solid var(--brass);border-radius:6px;padding:1px 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 0 16px}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 14px;white-space:nowrap;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.f{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:10px;flex-wrap:wrap}
.f .t{flex:1;min-width:180px}.f .t b{display:block;font-weight:600}.f .t small{color:var(--mut)}
.bd{font-size:11px;font-weight:600;border-radius:5px;padding:2px 7px;background:var(--bg);border:1px solid var(--ln);color:var(--mut);margin-right:6px}
.bd.new{background:var(--brass);color:#fff;border-color:var(--brass)}
.f button,.f a.sm{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:8px;padding:7px 11px;font-size:14px}
.f button.v{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.crumb{color:var(--mut);font-size:14px;margin-bottom:10px}.crumb a{text-decoration:underline}
.empty{text-align:center;padding:48px 20px;border:1px dashed var(--ln);border-radius:var(--r);color:var(--mut)}
.empty b{display:block;font:600 20px Fraunces,serif;color:var(--ink);margin-bottom:4px}
.gal{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.gal figure{margin:0;background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--ln);box-shadow:var(--sh)}
.gal img,.ev img{width:100%;display:block;object-fit:cover}.gal figcaption{padding:12px 16px;color:var(--mut);font-size:14px}
.dev{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.av{width:132px;height:132px;border-radius:50%;object-fit:cover;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 40px Fraunces,serif;border:4px solid var(--brass)}
footer{background:var(--hero);color:#b9ccd2;padding:34px 0;margin-top:30px;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}footer a{margin-right:14px;text-decoration:underline}
#modal{position:fixed;inset:0;background:#000c;z-index:50;display:none;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 12px 12px}
#modal.open{display:flex}#modal .top{display:flex;justify-content:space-between;color:#fff;padding:6px 4px 10px;gap:10px}
#modal .top button,#modal .top a{background:#fff;color:#17252d;border:0;border-radius:8px;padding:7px 14px;font-weight:600}
#frame{flex:1;border:0;border-radius:10px;background:linear-gradient(90deg,#e6e9e8 25%,#f3f5f4 50%,#e6e9e8 75%) 0 0/200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
#top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:none;background:var(--ink);color:var(--bg);border:0;border-radius:50%;width:44px;height:44px;z-index:15;box-shadow:var(--sh)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.rv{opacity:0;transform:translateY(12px);transition:.5s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}*{animation:none!important;scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="logo" href="#/"><i>M39</i>Faiyaaz MGT 39</a>
  <nav id="nav" aria-label="Main">
    <a href="#/" data-r="">Home</a><a href="#/semesters" data-r="semesters">Semesters</a><a href="#/m39" data-r="m39">Management 39</a><a href="#/events" data-r="events">Event Memories</a><a href="#/achievements" data-r="achievements">Achievements</a><a href="#/about" data-r="about">About</a>
  </nav>
  <button class="ib" id="theme" aria-label="Toggle dark mode">🌙</button>
  <button class="ib" id="menu" aria-label="Menu">☰</button>
</div></header>
<main id="app"></main>
<footer><div class="wrap">
  <div><b>Faiyaaz MGT 39</b><br>Made for Management 39 · University of Chittagong<br><span id="upd"></span></div>
  <div><a href="#/semesters">Semesters</a><a href="#/m39">Management 39</a><a href="#/about">About</a></div>
</div></footer>
<div id="modal" role="dialog" aria-modal="true"><div class="top"><button id="mclose">✕ Close</button><b id="mtitle" style="align-self:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></b><a id="mdl" download>Download</a></div><iframe id="frame" title="Document viewer"></iframe></div>
<button id="top" aria-label="Back to top">↑</button><div id="toast"></div>
<script src="data.js"></script>
<script>
const S=window.SITE,$=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS={notes:'Notes',slides:'Slides',books:'Books',syllabus:'Syllabus',questions:'Recent Questions'};
const courses=()=>S.semesters.flatMap(s=>s.courses.map(c=>({...c,sem:s})));
const files=()=>courses().flatMap(c=>Object.keys(CATS).flatMap(k=>((c.files||{})[k]||[]).map(f=>({...f,cat:k,course:c}))));
const fmt=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const isNew=d=>d&&(Date.now()-new Date(d))/864e5<=14;
const empty=(t,m)=>`<div class="empty"><b>${t}</b>${m}</div>`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800)};
let cat='all';

function fileRow(f,showCourse){
  const url=new URL(f.file,location.href.split('#')[0]).href,i=files().indexOf(files().find(x=>x.file===f.file));
  return `<div class="f"><div class="t"><b>${esc(f.title)}</b><small>${showCourse?esc(f.course.code)+' · ':''}${esc(CATS[f.cat])}${f.date?' · '+fmt(f.date):''}</small></div>
  ${isNew(f.date)?'<span class="bd new">New</span>':''}<span class="bd">PDF</span>
  <button class="v" data-view="${esc(f.file)}" data-t="${esc(f.title)}">View</button>
  <a class="sm" href="${esc(f.file)}" download>Download</a>
  <a class="sm" target="_blank" rel="noopener" aria-label="Share on WhatsApp" href="https://wa.me/?text=${encodeURIComponent(f.title+' — '+url)}">WhatsApp</a>
  <button data-copy="${esc(url)}">Copy link</button></div>`}

const V={
home(){
  const cs=courses(),fs=files(),rec=fs.filter(f=>f.date).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  return `<section class="hero"><div class="wrap"><h1>Management 39 Academic Resources</h1>
  <p>Notes, slides, books, syllabus and recent-year questions for every course, organized by semester.</p>
  <a class="btn pri" href="#/semesters">Browse semesters</a> <a class="btn ghost" href="#/m39">Meet the batch</a>
  <div class="sbox"><input id="q" type="search" placeholder="Search a course or file, e.g. BCC-104" autocomplete="off" aria-label="Search"><div id="res" hidden></div></div></div></section>
  <div class="wrap"><div class="stats"><div><b data-n="${S.semesters.length}">0</b><span>Semesters</span></div><div><b data-n="${cs.length}">0</b><span>Courses</span></div><div><b data-n="${fs.length}">0</b><span>Files</span></div></div></div>
  <section class="s"><div class="wrap rv"><h2>Recently added</h2><p class="sub">The latest uploads, newest first.</p>
  ${rec.length?rec.map(f=>fileRow(f,1)).join(''):empty('Nothing here yet','New files will show up here as soon as they are uploaded.')}</div></section>
  <section class="s" style="padding-top:0"><div class="wrap rv"><h2>Semesters</h2><p class="sub">Pick a semester to see its courses.</p>${semGrid()}</div></section>`},
semesters(){return `<section class="s"><div class="wrap"><h2>Semesters</h2><p class="sub">Pick a semester to see its courses.</p>${semGrid()}</div></section>`},
semester(id){const s=S.semesters.find(x=>x.id===id);if(!s)return V.nf();
  return `<section class="s"><div class="wrap"><div class="crumb"><a href="#/semesters">Semesters</a> / ${esc(s.name)}</div><h2>${esc(s.name)}</h2><p class="sub">${s.courses.length} courses</p>
  <div class="grid">${s.courses.map(c=>`<a class="card" href="#/course/${encodeURIComponent(c.code)}"><span class="code">${esc(c.code)}</span><h3>${esc(c.title)}</h3><p>${Object.keys(CATS).reduce((n,k)=>n+((c.files||{})[k]||[]).length,0)} files</p></a>`).join('')}</div></div></section>`},
course(code){const c=courses().find(x=>x.code===code);if(!c)return V.nf();
  const fs=Object.keys(CATS).flatMap(k=>((c.files||{})[k]||[]).map(f=>({...f,cat:k,course:c})));
  const list=fs.filter(f=>cat==='all'||f.cat===cat);
  return `<section class="s"><div class="wrap"><div class="crumb"><a href="#/semesters">Semesters</a> / <a href="#/semester/${c.sem.id}">${esc(c.sem.name)}</a> / ${esc(c.code)}</div>
  <span class="code">${esc(c.code)}</span><h2 style="margin-top:6px">${esc(c.title)}</h2><p class="sub">${fs.length} files</p>
  <div class="chips">${['all',...Object.keys(CATS)].map(k=>`<button class="chip ${k===cat?'on':''}" data-cat="${k}">${k==='all'?'All':CATS[k]}</button>`).join('')}</div>
  ${list.length?list.map(f=>fileRow(f)).join(''):empty('Coming soon','No files in this section yet. Check back after the next upload.')}</div></section>`},
m39(){return `<section class="s"><div class="wrap"><h2>Management 39</h2><p class="sub">Department of Management, University of Chittagong.</p><div class="gal">${S.gallery.map(g=>`<figure><img src="${esc(g.src)}" alt="${esc(g.caption)}" loading="lazy"><figcaption>${esc(g.caption)}</figcaption></figure>`).join('')}</div></div></section>`},
events(){return `<section class="s"><div class="wrap"><h2>Event Memories</h2><p class="sub">Moments from our batch.</p>${S.events.length?`<div class="gal">${S.events.map(e=>`<figure class="ev">${e.photo?`<img src="${esc(e.photo)}" alt="${esc(e.title)}" loading="lazy">`:''}<figcaption><b>${esc(e.title)}</b> · ${fmt(e.date)}<br>${esc(e.text)}</figcaption></figure>`).join('')}</div>`:empty('No events yet','Event photos will be added here.')}</div></section>`},
achievements(){return `<section class="s"><div class="wrap"><h2>Achievements</h2><p class="sub">What our batch has accomplished.</p>${S.achievements.length?`<div class="grid">${S.achievements.map(a=>`<div class="card"><h3>${esc(a.title)}</h3><p>${esc(a.by)} · ${fmt(a.date)}</p><p style="margin-top:8px">${esc(a.text)}</p></div>`).join('')}</div>`:empty('No achievements listed yet','Send yours to the developer to be featured here.')}</div></section>`},
about(){const c=S.contact;return `<section class="s"><div class="wrap"><h2>About</h2><p class="sub">A free notes hub for Management 39, built by a classmate.</p>
  <div class="card dev"><img class="av" src="developer.jpg" alt="Abrar Faiyaaz" onerror="this.outerHTML='<div class=&quot;av&quot;>AF</div>'">
  <div><h3 style="font-size:24px">Abrar Faiyaaz</h3><p>MGT-39 · Web Developer<br>BBA, Department of Management, University of Chittagong</p>
  <p style="margin-top:14px"><a class="btn pri" href="mailto:${esc(c.email)}">Email</a> <a class="btn ghost" style="color:var(--ink);border-color:var(--ln)" target="_blank" rel="noopener" href="https://wa.me/88${esc(c.phone)}">WhatsApp</a></p></div></div></div></section>`},
nf(){return `<section class="s"><div class="wrap">${empty('Page not found','That link does not exist. <a href="#/" style="text-decoration:underline">Go to the home page</a>.')}</div></section>`}
};
function semGrid(){return `<div class="grid">${S.semesters.map(s=>`<a class="card" href="#/semester/${s.id}"><span class="code">${esc(s.name)}</span><h3>${s.courses.length} courses</h3><p>${s.courses.map(c=>esc(c.code)).join(', ')}</p></a>`).join('')}</div>`}

function route(){
  const [,p='',a='']=location.hash.split('/'),arg=decodeURIComponent(a);
  const page=V[p]&&p!=='nf'?p:(p===''?'home':'nf');
  if(p==='course'&&route.last!==location.hash)cat='all';route.last=location.hash;
  $('#app').innerHTML=V[page](arg);
  $$('nav a').forEach(l=>l.classList.toggle('on',l.dataset.r===(['semester','course'].includes(p)?'semesters':p)));
  $('#nav').classList.remove('open');window.scrollTo(0,0);after();
}
function after(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}));$$('.rv').forEach(e=>io.observe(e));
  const co=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;co.unobserve(e.target);const n=+e.target.dataset.n;let i=0;const t=setInterval(()=>{e.target.textContent=Math.min(n,++i);if(i>=n)clearInterval(t)},60)}));$$('[data-n]').forEach(e=>co.observe(e));
  const q=$('#q');if(q)q.oninput=()=>{const v=q.value.trim().toLowerCase(),r=$('#res');if(!v){r.hidden=true;return}
    const hits=[...courses().filter(c=>(c.code+c.title).toLowerCase().includes(v)).map(c=>`<a href="#/course/${encodeURIComponent(c.code)}">${esc(c.code)} · ${esc(c.title)}<small>Course</small></a>`),
    ...files().filter(f=>f.title.toLowerCase().includes(v)).map(f=>`<a href="#/course/${encodeURIComponent(f.course.code)}">${esc(f.title)}<small>${esc(f.course.code)} · ${esc(CATS[f.cat])}</small></a>`)];
    r.innerHTML=hits.join('')||'<a>No results. Try a course code like BCC-104.</a>';r.hidden=false};
}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.view){$('#mtitle').textContent=t.dataset.t;$('#mdl').href=t.dataset.view;$('#frame').src=t.dataset.view;$('#modal').classList.add('open')}
  if(t.dataset.copy)navigator.clipboard.writeText(t.dataset.copy).then(()=>toast('Link copied'));
  if(t.dataset.cat){cat=t.dataset.cat;const y=scrollY;$('#app').innerHTML=V.course(decodeURIComponent(location.hash.split('/')[2]));scrollTo(0,y)}
  if(!t.closest('.sbox')){const r=$('#res');if(r)r.hidden=true}
});
$('#mclose').onclick=()=>{$('#modal').classList.remove('open');$('#frame').src='about:blank'};
addEventListener('keydown',e=>{if(e.key==='Escape')$('#mclose').click()});
$('#menu').onclick=()=>$('#nav').classList.toggle('open');
const th=$('#theme'),setT=m=>{document.documentElement.dataset.theme=m;th.textContent=m==='dark'?'☀️':'🌙';try{localStorage.setItem('m39t',m)}catch(_){}};
let saved;try{saved=localStorage.getItem('m39t')}catch(_){}
setT(saved||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
th.onclick=()=>setT(document.documentElement.dataset.theme==='dark'?'light':'dark');
$('#top').onclick=()=>scrollTo({top:0});addEventListener('scroll',()=>$('#top').style.display=scrollY>500?'block':'none');
$('#upd').textContent='Last updated: '+fmt(S.updated);
addEventListener('hashchange',route);route();
</script>
</body>
</html>
