<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">

<link rel="icon" href="favicon.svg"><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f6fb;--card:#fff;--tx:#1b1a24;--mu:#6b6980;--ac:#6d5dfc;--ac2:#e9e6ff;--bd:#e8e6f2;--sh:0 6px 24px rgba(40,30,90,.07)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0e15;--card:#18171f;--tx:#efeef7;--mu:#9d9bb2;--ac:#9a8dff;--ac2:#25223a;--bd:#2a2838;--sh:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0f0e15;--card:#18171f;--tx:#efeef7;--mu:#9d9bb2;--ac:#9a8dff;--ac2:#25223a;--bd:#2a2838;--sh:0 6px 24px rgba(0,0,0,.4)}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}h1,h2,h3{line-height:1.15;margin:0;letter-spacing:-.02em}
.w{max-width:1000px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:800;letter-spacing:-.03em}.logo span{color:var(--ac)}
.links{display:flex;gap:6px}.links a{padding:8px 14px;border-radius:99px;color:var(--mu);font-weight:500;font-size:15px;transition:.2s}.links a:hover{background:var(--ac2);color:var(--ac)}
.burger{display:none;background:none;border:1px solid var(--bd);border-radius:12px;width:42px;height:42px;color:var(--tx);font-size:20px;cursor:pointer}
@media(max-width:640px){.burger{display:block}.links{display:none;position:absolute;left:12px;right:12px;top:64px;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:8px;box-shadow:var(--sh)}.links.open{display:flex}.links a{padding:12px 14px}}
a:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hero{padding:72px 0 40px;text-align:center}
.pill{display:inline-block;background:var(--ac2);color:var(--ac);padding:6px 14px;border-radius:99px;font-size:13px;font-weight:600;margin-bottom:18px}
.hero h1{font-size:clamp(36px,8vw,64px);font-weight:800}.hero h1 span{background:linear-gradient(90deg,var(--ac),#ff7eb6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);max-width:520px;margin:16px auto 28px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ac);color:#fff;padding:13px 24px;border-radius:99px;font-weight:600;border:0;cursor:pointer;font-size:15px;transition:.2s;box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 35%,transparent)}
.btn:hover{transform:translateY(-2px)}.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
section{padding:44px 0}h2{font-size:clamp(24px,5vw,32px);margin-bottom:6px}.sub{color:var(--mu);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{display:block;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:22px;box-shadow:var(--sh);transition:.25s}
.card:hover{transform:translateY(-4px);border-color:var(--ac)}.card h3{font-size:18px;margin-bottom:6px}.card small{color:var(--mu)}
.ic{width:44px;height:44px;border-radius:14px;background:var(--ac2);display:grid;place-items:center;font-size:22px;margin-bottom:14px}
.crumb{font-size:14px;color:var(--mu);margin:28px 0 8px}.crumb a{color:var(--ac)}
.file{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 18px;margin-bottom:10px;transition:.2s}.file:hover{border-color:var(--ac)}
.file b{display:block}.file small{color:var(--mu)}
.empty{border:1.5px dashed var(--bd);border-radius:22px;padding:40px 20px;text-align:center;color:var(--mu)}
.viewer{width:100%;height:75vh;border:1px solid var(--bd);border-radius:18px;background:var(--card)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.gal figure{margin:0;border-radius:26px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--bd);background:var(--card)}
.gal img{display:block;width:100%;height:auto;transition:transform .5s}.gal figure:hover img{transform:scale(1.03)}
.gal figcaption{padding:12px 18px;color:var(--mu);font-size:14px}
.dev{display:flex;align-items:center;gap:24px;background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:24px;box-shadow:var(--sh);flex-wrap:wrap}
.dev img{width:130px;height:130px;border-radius:50%;object-fit:cover;object-position:50% 35%;border:3px solid var(--ac2)}
.dev h3{font-size:22px}.dev p{margin:2px 0;color:var(--mu)}.dev a{color:var(--ac);font-weight:500}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ach article{background:var(--card);border:1px solid var(--bd);border-radius:22px;overflow:hidden;box-shadow:var(--sh);transition:.25s}
.ach article:hover{transform:translateY(-4px);border-color:var(--ac)}
.ach img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.ach .b{padding:18px 20px}.ach h3{font-size:18px;margin:8px 0 6px}.ach p{margin:0;color:var(--mu);font-size:15px}
.evc{display:block;background:var(--card);border:1px solid var(--bd);border-radius:22px;overflow:hidden;box-shadow:var(--sh);transition:.25s}
.evc:hover{transform:translateY(-4px);border-color:var(--ac)}
.evc .cv{aspect-ratio:16/10;background:linear-gradient(135deg,var(--ac2),var(--bg));display:grid;place-items:center;font-size:34px}
.evc img{display:block;width:100%;height:100%;object-fit:cover}
.evc .cv{overflow:hidden}.evc .b{padding:16px 20px}.evc h3{font-size:18px}.evc small{color:var(--mu)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.pg img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;cursor:zoom-in;transition:.25s;border:1px solid var(--bd)}
.pg img:hover{transform:scale(1.03)}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:12px}
.nr{display:flex;gap:8px;order:3}.links{order:2;margin-left:auto;margin-right:12px}
.tgl{width:42px;height:42px;border:1px solid var(--bd);border-radius:12px;background:none;color:var(--tx);font-size:18px;cursor:pointer;transition:.2s}.tgl:hover{background:var(--ac2)}
footer{text-align:center;color:var(--mu);font-size:13px;padding:30px 0 50px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.fade{animation:f .4s ease both}@keyframes f{from{opacity:0;transform:translateY(8px)}}
</style></head><body>
<nav><div class="w"><a class="logo" href="#/">Faiyaaz <span>MGT 39</span></a>
<div class="nr"><button class="tgl" id="th" aria-label="Switch theme">🌙</button><button class="burger" id="bg" aria-label="Menu" aria-expanded="false">☰</button></div>
<div class="links" id="ln"><a href="#/">Home</a><a href="#/semesters">Semesters</a><a href="#/m39">Management 39</a><a href="#/events">Event Memories</a><a href="#/achievements">Achievements</a><a href="#/about">About</a></div></div></nav>
<main id="app" class="w"></main>
<footer>© <span id="yr"></span> faiyaazmgt39.com · Made for Management 39</footer>
<script>
/* ============ CONTENT DATA — edit ONLY this file to grow the site ============
 EXAMPLE: notes:[{title:"Chapter 1 Notes",url:"pom-ch1.pdf"},{title:"Chapter 2 Notes",url:"pom-ch2.pdf"}]
 Add a semester: push to SEMESTERS. Add a course: add to its courses[].
 Add a file: add {title, url, size?} to a category array; url = "your-file.pdf" (PDF uploaded next to index.html) or any PDF link (e.g. Google Drive /preview link, GitHub raw, hosted .pdf).
 Add a photo: push to PHOTOS. */
const CATEGORIES=[{id:"notes",name:"Notes",icon:"📝"},{id:"slides",name:"Slides",icon:"🖥️"},{id:"books",name:"Books",icon:"📚"},{id:"syllabus",name:"Syllabus",icon:"📋"},{id:"questions",name:"Recent Year Questions",icon:"🧾"}];
const SEMESTERS=[
 {id:"1",name:"1st Semester",courses:[
  {id:"intro-business",name:"Introduction to Business",code:"BCC-101",teacher:"Prof. Dr. Md. Harisur Rahman Howladar",files:{notes:[],slides:[],books:[],syllabus:[],questions:[]}},
  {id:"basic-accounting",name:"Basic Accounting",code:"BCC-102",teacher:"Mrs. Dipa Das",files:{notes:[],slides:[],books:[],syllabus:[],questions:[]}},
  {id:"math",name:"Basic Mathematics",code:"BCC-103",teacher:"Prof. Dr. Anupam Kumar Das",files:{notes:[],slides:[],books:[],syllabus:[],questions:[]}},
  {id:"pom",name:"Principles of Management",code:"BCC-104",teacher:"Prof. Dr. Shameema Ferdausy",files:{notes:[],slides:[],books:[],syllabus:[],questions:[]}},
  {id:"comm",name:"Essentials in Communications",code:"BCC-105",teacher:"Prof. Sharmeen Ahmed",files:{notes:[],slides:[],books:[],syllabus:[],questions:[]}}
 ]},
 {id:"2",name:"2nd Semester",courses:[
  {id:"marketing",name:"Principles of Marketing",code:"BCC-106",teacher:"Prof. Abu Mohammad Atiqur Rahman",files:{notes:[],slides:[],books:[],syllabus:[],questions:[]}},
  {id:"macro",name:"Macroeconomics",code:"GED-107",teacher:"Prof. Dr. Anupam Kumar Das",files:{notes:[],slides:[],books:[],syllabus:[],questions:[]}},
  {id:"stat",name:"Basic Statistics",code:"GED-108",teacher:"Prof. Dr. Mohammad Khaled Afzal",files:{notes:[],slides:[],books:[],syllabus:[],questions:[]}},
  {id:"law",name:"Business Law",code:"BCC-109",teacher:"Prof. Dr. Md. Mizanur Rahman Chowdhury",files:{notes:[],slides:[],books:[{title:"Commercial Law and Industrial Law \u2014 Part 1 (pages 1\u2013561)",url:"law-part1.pdf",size:"PDF"},{title:"Commercial Law and Industrial Law \u2014 Part 2 (pages 562\u20131122)",url:"law-part2.pdf",size:"PDF"}],syllabus:[],questions:[]}},
  {id:"ict",name:"Information and Communication Technology",code:"GED-110",teacher:"Mrs. Chowdhury Ummeh Kulsum",files:{notes:[],slides:[],books:[],syllabus:[],questions:[]}}
 ]}
];
const PHOTOS=[{src:"group.jpg",alt:"Management 39 batch group photo on campus",caption:"Management 39 — our batch"}];
/* Add achievements here: {title:"...",date:"Oct 2026",text:"short description",photo:"optional-photo.jpg"} (comma between items) */
const ACHIEVEMENTS=[];
/* Event Memories: add photos by listing file names in photos:["a.jpg","b.jpg"]; add a new event as a new {..} line */
const EVENTS=[
 {id:"asharer-ashor",name:"আষাঢ়ের আসর",date:"",place:"",photos:[]},
 {id:"freshers-odyssey",name:"Fresher’s Odyssey",date:"13 Aug 2026",place:"FBA Auditorium · presented by Management 38",photos:["fresher-01.jpg","fresher-02.jpg","fresher-03.jpg","fresher-04.jpg","fresher-05.jpg","fresher-06.jpg","fresher-07.jpg","fresher-08.jpg","fresher-09.jpg","fresher-10.jpg","fresher-11.jpg","fresher-12.jpg"]},
 {id:"hall-fest-2026",name:"Hall Fest-2026",date:"10 Sep 2026",place:"Shahjalal Hall Dining · Department of Management",photos:["hallfest-01.jpg","hallfest-02.jpg","hallfest-03.jpg","hallfest-04.jpg","hallfest-05.jpg","hallfest-06.jpg"]}
];

const DEV={name:"Abrar Faiyaaz",role:"MGT-39 · Web Developer",phone:"01852268399",email:"abrarfaiyaaz89@gmail.com",photo:"abrar.jpg"};
/* ============ UI ============ */
const $=s=>document.querySelector(s),app=$("#app"),e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("#yr").textContent=new Date().getFullYear();
const bg=$("#bg"),ln=$("#ln");bg.onclick=()=>{const o=ln.classList.toggle("open");bg.setAttribute("aria-expanded",o)};
const th=$("#th"),root=document.documentElement;
function applyTheme(m){root.setAttribute("data-theme",m);th.textContent=m=="dark"?"☀️":"🌙";th.setAttribute("aria-label",m=="dark"?"Switch to day mode":"Switch to night mode")}
let savedTheme=null;try{savedTheme=localStorage.getItem("theme")}catch(x){}
applyTheme(savedTheme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
th.onclick=()=>{const m=root.getAttribute("data-theme")=="dark"?"light":"dark";applyTheme(m);try{localStorage.setItem("theme",m)}catch(x){}};

const semCards=()=>SEMESTERS.map(s=>`<a class="card" href="#/s/${s.id}"><div class="ic">🎓</div><h3>${e(s.name)}</h3><small>${s.courses.length} courses</small></a>`).join("");
const gallery=()=>`<div class="gal">${PHOTOS.map(p=>`<figure><img src="${p.src}" alt="${e(p.alt)}" loading="lazy" decoding="async"><figcaption>${e(p.caption)}</figcaption></figure>`).join("")}</div>`;
const achv=()=>ACHIEVEMENTS.length?`<div class="ach">${ACHIEVEMENTS.map(x=>`<article>${x.photo?`<img src="${e(x.photo)}" alt="${e(x.title)}" loading="lazy" decoding="async">`:""}<div class="b">${x.date?`<span class="pill" style="margin:0">${e(x.date)}</span>`:""}<h3>${e(x.title)}</h3>${x.text?`<p>${e(x.text)}</p>`:""}</div></article>`).join("")}</div>`:`<div class="empty">Our achievements will be added here soon.</div>`;
const evCards=()=>`<div class="ach">${EVENTS.map(v=>`<a class="evc" href="#/events/${v.id}"><div class="cv">${v.photos.length?`<img src="${v.photos[0]}" alt="${e(v.name)}" loading="lazy" decoding="async">`:"📸"}</div><div class="b"><h3>${e(v.name)}</h3><small>${v.photos.length?v.photos.length+" photos":"Photos coming soon"}${v.date?" · "+e(v.date):""}</small></div></a>`).join("")}</div>`;
const about=()=>`<div class="dev"><img src="${DEV.photo}" alt="Portrait of ${e(DEV.name)}, web developer" loading="lazy"><div><small style="color:var(--mu)">Built by</small><h3>${e(DEV.name)}</h3><p>${e(DEV.role)}</p><p><a href="tel:${DEV.phone}">${DEV.phone}</a> · <a href="mailto:${DEV.email}">${DEV.email}</a></p></div></div>`;
const home=()=>`<div class="hero fade"><span class="pill">Management 39 · Academic Hub</span><h1>Notes, slides &amp; <span>past questions</span>, all in one place.</h1><p>A student-built archive for Management 39. Pick your semester, open a course, and read PDFs right here.</p><a class="btn" href="#/semesters">Explore Notes →</a></div>
<section id="sem"><h2>Semesters</h2><p class="sub">Choose a semester to see its courses.</p><div class="grid">${semCards()}</div></section>
<section><h2>Management 39</h2><p class="sub">Our batch.</p>${gallery()}</section>
<section><h2>Event Memories</h2><p class="sub">Moments from our events.</p>${evCards()}</section>
<section><h2>Achievements</h2><p class="sub">What Management 39 has accomplished.</p>${achv()}</section>
<section><h2>Built by ${e(DEV.name)}</h2><p class="sub">The person behind the site.</p>${about()}</section>`;
function route(){
 const p=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean),[t,a,b,c,d]=p;let h="";
 const sem=SEMESTERS.find(s=>s.id==a),co=sem&&sem.courses.find(x=>x.id==b),cat=CATEGORIES.find(x=>x.id==c);
 if(!t)h=home();
 else if(t=="semesters")h=`<section class="fade"><h2>Semesters</h2><p class="sub">Choose a semester.</p><div class="grid">${semCards()}</div></section>`;
 else if(t=="m39")h=`<section class="fade"><h2>Management 39</h2><p class="sub">Our batch.</p>${gallery()}</section>`;
 else if(t=="events"&&!a)h=`<section class="fade"><h2>Event Memories</h2><p class="sub">Choose an event.</p>${evCards()}</section>`;
 else if(t=="events"){const v=EVENTS.find(x=>x.id==a);h=v?`<section class="fade"><div class="crumb"><a href="#/events">Event Memories</a> / ${e(v.name)}</div><h2>${e(v.name)}</h2><p class="sub">${[v.date,v.place].filter(Boolean).map(e).join(" · ")}</p>${v.photos.length?`<div class="pg">${v.photos.map((p,i)=>`<img src="${p}" data-lb="${p}" alt="${e(v.name)} photo ${i+1}" loading="lazy" decoding="async">`).join("")}</div>`:`<div class="empty">Photos will be added soon.</div>`}</section>`:`<section><div class="empty">Event not found. <a href="#/events" style="color:var(--ac)">Back</a></div></section>`}
 else if(t=="achievements")h=`<section class="fade"><h2>Achievements</h2><p class="sub">What Management 39 has accomplished.</p>${achv()}</section>`;
 else if(t=="about")h=`<section class="fade"><h2>Built by ${e(DEV.name)}</h2><p class="sub">The person behind the site.</p>${about()}</section>`;
 else if(t=="s"&&sem&&!b)h=`<section class="fade"><div class="crumb"><a href="#/semesters">Semesters</a> / ${e(sem.name)}</div><h2>${e(sem.name)}</h2><p class="sub">Select a course.</p><div class="grid">${sem.courses.map(x=>`<a class="card" href="#/s/${sem.id}/${x.id}"><div class="ic">📘</div><h3>${e(x.name)}</h3><small>${e(x.code)}${x.teacher?"<br>"+e(x.teacher):""}</small></a>`).join("")}</div></section>`;
 else if(t=="s"&&co&&!c)h=`<section class="fade"><div class="crumb"><a href="#/semesters">Semesters</a> / <a href="#/s/${sem.id}">${e(sem.name)}</a> / ${e(co.name)}</div><h2>${e(co.name)}</h2><p class="sub">${e(co.code)}${co.teacher?" · "+e(co.teacher):""}</p><div class="grid">${CATEGORIES.map(k=>`<a class="card" href="#/s/${sem.id}/${co.id}/${k.id}"><div class="ic">${k.icon}</div><h3>${k.name}</h3><small>${(co.files[k.id]||[]).length} files</small></a>`).join("")}</div></section>`;
 else if(t=="s"&&co&&cat){const fs=co.files[cat.id]||[],base=`#/s/${sem.id}/${co.id}`,cr=`<div class="crumb"><a href="#/semesters">Semesters</a> / <a href="#/s/${sem.id}">${e(sem.name)}</a> / <a href="${base}">${e(co.name)}</a> / ${cat.name}</div>`;
  if(d!==undefined&&fs[d]){const f=fs[d];h=`<section class="fade">${cr}<h2>${e(f.title)}</h2><div class="bar"><a class="btn o" href="${base}/${cat.id}">← Back</a><a class="btn o" href="${e(f.url)}" target="_blank" rel="noopener">Open in new tab</a><a class="btn" href="${e(f.url)}" download>Download</a></div><iframe class="viewer" src="${e(f.url)}" title="${e(f.title)}" loading="lazy"></iframe></section>`}
  else h=`<section class="fade">${cr}<h2>${cat.name}</h2><p class="sub">${e(co.name)}</p>${fs.length?fs.map((f,i)=>`<a class="file" href="${base}/${cat.id}/${i}"><div><b>📄 ${e(f.title)}</b><small>${e(f.size||"PDF")}</small></div><span class="pill" style="margin:0">View</span></a>`).join(""):`<div class="empty">No files here yet. Check back soon!</div>`}</section>`}
 else h=`<section><div class="empty">Page not found. <a href="#/" style="color:var(--ac)">Go home</a></div></section>`;
 app.innerHTML=h;ln.classList.remove("open");bg.setAttribute("aria-expanded",false);scrollTo(0,0);
 if(t=="semesters"||!t&&0){} }
const lb=document.createElement("div");lb.className="lb";lb.onclick=()=>lb.classList.remove("on");document.body.appendChild(lb);
app.addEventListener("click",ev=>{const t=ev.target;if(t.dataset&&t.dataset.lb){lb.innerHTML=`<img src="${t.dataset.lb}" alt="${e(t.alt)}">`;lb.classList.add("on")}});
addEventListener("keydown",ev=>{if(ev.key=="Escape")lb.classList.remove("on")});
addEventListener("hashchange",route);route();
</script></body></html>
